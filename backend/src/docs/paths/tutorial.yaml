paths:
  /api/tutorial:
    get:
      summary: Get tutorial by user
      tags: [Tutorial]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Tutorial details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Tutorial'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Upsert tutorial
      tags: [Tutorial]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTutorialRequest'
      responses:
        '200':
          description: Tutorial updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Tutorial'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tutorial/step/complete:
    post:
      summary: Complete tutorial step
      tags: [Tutorial]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepId]
              properties:
                stepId:
                  type: string
                  example: step1
      responses:
        '200':
          description: Step completed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Tutorial'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tutorial/complete:
    post:
      summary: Complete tutorial
      tags: [Tutorial]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Tutorial completed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Tutorial'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tutorial/reset:
    post:
      summary: Reset tutorial
      tags: [Tutorial]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Tutorial reset successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/Tutorial'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

