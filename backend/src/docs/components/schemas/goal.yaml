Goal:
  type: object
  properties:
    id:
      type: string
      example: "507f1f77bcf86cd799439011"
    title:
      type: string
      example: Save for vacation
    targetAmount:
      type: number
      example: 5000
    currentAmount:
      type: number
      example: 2500
    dueDate:
      type: string
      format: date-time
    user:
      type: string
      example: "507f1f77bcf86cd799439011"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateGoalRequest:
  type: object
  required: [title, targetAmount, dueDate]
  properties:
    title:
      type: string
      example: Save for vacation
    targetAmount:
      type: number
      minimum: 0
      example: 5000
    currentAmount:
      type: number
      default: 0
      minimum: 0
      example: 0
    dueDate:
      type: string
      format: date-time
      example: "2024-12-31T23:59:59Z"

UpdateGoalRequest:
  type: object
  properties:
    title:
      type: string
    targetAmount:
      type: number
      minimum: 0
    currentAmount:
      type: number
      minimum: 0
    dueDate:
      type: string
      format: date-time

