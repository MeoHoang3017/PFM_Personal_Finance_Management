Currency:
  type: object
  properties:
    id:
      type: string
      example: "507f1f77bcf86cd799439011"
    code:
      type: string
      example: USD
    name:
      type: string
      example: US Dollar
    symbol:
      type: string
      example: "$"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

