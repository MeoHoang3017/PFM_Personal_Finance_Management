Transaction:
  type: object
  properties:
    id:
      type: string
      example: "507f1f77bcf86cd799439011"
    amount:
      type: number
      example: 100.50
    currency:
      type: string
      example: "USD"
    type:
      type: string
      enum: [income, expense, transfer, exchange]
      example: expense
    category:
      type: string
      example: "507f1f77bcf86cd799439011"
    categoryName:
      type: string
    date:
      type: string
      format: date-time
    description:
      type: string
      example: Grocery shopping
    notes:
      type: string
      example: Weekly groceries
    wallet:
      type: string
      example: "507f1f77bcf86cd799439011"
    counterpartyWallet:
      type: string
    exchangePairId:
      type: string
    exchangeLeg:
      type: string
      enum: [out, in]
    user:
      type: string
      example: "507f1f77bcf86cd799439011"
    displayCurrency:
      type: string
    currencySymbol:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateTransactionRequest:
  type: object
  required: [amount, type, category, wallet]
  properties:
    amount:
      type: number
      minimum: 0
      example: 100.50
    type:
      type: string
      enum: [income, expense, transfer]
      example: expense
    category:
      type: string
      example: "507f1f77bcf86cd799439011"
    date:
      type: string
      format: date-time
      example: "2024-01-15T10:30:00Z"
    description:
      type: string
      example: Grocery shopping
    notes:
      type: string
      example: Weekly groceries
    wallet:
      type: string
      example: "507f1f77bcf86cd799439011"

CreateWalletExchangeRequest:
  type: object
  required: [fromWallet, toWallet, amount]
  properties:
    fromWallet:
      type: string
    toWallet:
      type: string
    amount:
      type: number
      minimum: 0
    date:
      type: string
      format: date-time
    description:
      type: string
    notes:
      type: string

WalletExchangeResult:
  type: object
  properties:
    exchangePairId:
      type: string
    outbound:
      $ref: '#/components/schemas/Transaction'
    inbound:
      $ref: '#/components/schemas/Transaction'

UpdateTransactionRequest:
  type: object
  properties:
    amount:
      type: number
      minimum: 0
    type:
      type: string
      enum: [income, expense, transfer, exchange]
    category:
      type: string
    date:
      type: string
      format: date-time
    description:
      type: string
    notes:
      type: string
    wallet:
      type: string
