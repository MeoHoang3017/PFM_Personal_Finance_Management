User:
  type: object
  properties:
    id:
      type: string
      example: "507f1f77bcf86cd799439011"
    username:
      type: string
      example: johndoe
    email:
      type: string
      format: email
      example: john@example.com
    theme:
      type: string
      enum: [light, dark]
      example: light
    language:
      type: string
      example: en
    currency:
      type: string
      example: USD
    avatarUrl:
      type: string
      example: https://example.com/avatar.jpg
    moneyFormat:
      type: string
      enum: [standard, compact, full]
      example: standard
    dailyReminder:
      type: boolean
      example: false
    reminderTime:
      type: string
      example: "09:00"

UpdateUserSettingsRequest:
  type: object
  properties:
    theme:
      type: string
      enum: [light, dark]
    language:
      type: string
    currency:
      type: string
    moneyFormat:
      type: string
      enum: [standard, compact, full]
    dailyReminder:
      type: boolean
    reminderTime:
      type: string
      pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
      example: "09:00"

ChangePasswordRequest:
  type: object
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
      format: password
    newPassword:
      type: string
      format: password
      minLength: 6

