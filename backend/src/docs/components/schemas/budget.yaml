Budget:
  type: object
  properties:
    id:
      type: string
      example: "507f1f77bcf86cd799439011"
    amount:
      type: number
      example: 1000
    currency:
      type: string
      description: ISO 4217 — hạn mức và spentAmount cùng đơn vị
      example: VND
    category:
      type: string
      example: "507f1f77bcf86cd799439011"
    categoryName:
      type: string
    categoryIcon:
      type: string
    categoryColor:
      type: string
    period:
      type: string
      enum: [weekly, monthly, yearly, custom]
      example: monthly
    startDate:
      type: string
      format: date-time
      description: Cửa sổ hiện tại (preset) hoặc khoảng custom
    endDate:
      type: string
      format: date-time
    user:
      type: string
      example: "507f1f77bcf86cd799439011"
    isActive:
      type: boolean
      example: true
    spentAmount:
      type: number
    isOverBudget:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateBudgetRequest:
  type: object
  required: [amount, category, period]
  properties:
    amount:
      type: number
      minimum: 0
      example: 1000
    category:
      type: string
      example: "507f1f77bcf86cd799439011"
    period:
      type: string
      enum: [weekly, monthly, yearly, custom]
      example: monthly
    startDate:
      type: string
      format: date-time
      description: Bắt buộc khi period = custom
    endDate:
      type: string
      format: date-time
    isActive:
      type: boolean
      default: true
      example: true
    currency:
      type: string
      description: ISO 4217; mặc định theo user
      example: VND

UpdateBudgetRequest:
  type: object
  properties:
    amount:
      type: number
      minimum: 0
    category:
      type: string
    period:
      type: string
      enum: [weekly, monthly, yearly, custom]
    startDate:
      type: string
      format: date-time
    endDate:
      type: string
      format: date-time
    isActive:
      type: boolean
    currency:
      type: string
      example: USD
